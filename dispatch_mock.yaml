server:
  url: "http://127.0.0.1:8000"
  api_token: "${CAIRN_API_TOKEN}"

runtime:
  execution: "container"
  interval: 3
  max_workers: 4
  max_running_projects: 2
  max_project_workers: 4
  healthcheck_timeout: 2
  worker_healthcheck: "startup_only"
  prompt_group: "mock"

tasks:
  bootstrap:
    timeout: 9
    conclude_timeout: 5
  reason:
    timeout: 5
    max_intents: 3
  explore:
    timeout: 9
    conclude_timeout: 5
  verify:
    timeout: 9
  audit:
    timeout: 9
  replay:
    timeout: 5

security:
  api_token_env: "CAIRN_API_TOKEN"
  capture_token_env: "CAIRN_CAPTURE_TOKEN"
  capture_ca_dir: "/var/cairn/capture-ca"
  evidence_root: "/var/cairn/evidence"
  traffic_root: "/var/cairn/traffic"
  archive_root: "/var/cairn/archive"
  static_encryption: true
  archive_encryption: true
  executor_url: ""

scope:
  enforce_scope_guard: true
  enforce_auth_window: true
  enforce_kill_switch: true
  default_scope_policy: "{}"

tuning:
  writeback_retries: 1
  reconcile_intent_timeout_multiplier: 2
  min_capture_ratio: 2.0
  min_capture_abs_diff: 3
  event_summary_max_bytes: 512
  command_evidence_max_bytes: 1048576
  event_raw_retain_days: 7
  sse_heartbeat_seconds: 15
  longpoll_hold_seconds: 20
  worker_rejected_cooldown_seconds: 5
  worker_unhealthy_cooldown_seconds: 5

container:
  image: "ghcr.io/oritera/cairn-worker-container:latest"
  network_mode: "bridge"
  completed_action: "stop"
  cap_add:
    - "NET_RAW"
    - "NET_ADMIN"

# Server base URL / token now live under `server.*` (v2). common_env carries no Cairn token (C5).
common_env: {}

workers:
  - name: "mock-observer-1"
    type: "mock"
    task_types: [reason, explore, bootstrap, verify, audit]
    max_running: 1
    priority: 0
    verify_eligible: true
    env:
      MOCK_HEALTHCHECK: '{"delay":[0,2],"outcomes":{"ok":0.9,"fail":0.1}}'
      MOCK_BOOTSTRAP: '{"delay":[5,10],"outcomes":{"ok":0.8,"rejected":0.1,"invalid_json":0.05,"empty":0.02,"command_fail":0.03}}'
      MOCK_BOOTSTRAP_CONCLUDE: '{"delay":[2,6],"outcomes":{"ok":0.8,"rejected":0.1,"invalid_json":0.05,"empty":0.02,"command_fail":0.03}}'
      MOCK_REASON: '{"delay":[2,6],"outcomes":{"intents":0.7,"finalize":0.1,"rejected":0.1,"invalid_json":0.05,"empty":0.02,"command_fail":0.03}}'
      MOCK_EXPLORE_EXECUTE: '{"delay":[5,10],"outcomes":{"fact":0.8,"rejected":0.1,"invalid_json":0.05,"empty":0.02,"command_fail":0.03}}'
      MOCK_EXPLORE_CONCLUDE: '{"delay":[2,6],"outcomes":{"fact":0.8,"rejected":0.1,"invalid_json":0.05,"empty":0.02,"command_fail":0.03}}'
      # v2 mock extensions (verify-mock-test-spec §2): coverage-result + verify/replay phases
      MOCK_EXPLORE_COVERAGE_OUTCOME: '{"outcomes":{"no_issue":0.5,"finding_created":0.4,"not_applicable":0.1}}'
      MOCK_VERIFY: '{"delay":[2,6],"outcomes":{"confirmed":0.5,"rejected":0.2,"needs_more_evidence":0.2,"accepted_false":0.1},"payload":{"verified_severity":"high","verified_traffic_ids":["tr-001"],"suggested_action":"none","reason":"mock"}}'
      MOCK_REPLAY: '{"delay":[1,3],"outcomes":{"remediated":0.6,"unchanged":0.3,"ambiguous":0.1},"payload":{"matched_original":0}}'

  - name: "mock-observer-2"
    type: "mock"
    task_types: [reason, explore, bootstrap, verify, audit]
    max_running: 1
    priority: 0
    verify_eligible: true
    env:
      MOCK_HEALTHCHECK: '{"delay":[0,2],"outcomes":{"ok":0.9,"fail":0.1}}'
      MOCK_BOOTSTRAP: '{"delay":[5,10],"outcomes":{"ok":0.8,"rejected":0.1,"invalid_json":0.05,"empty":0.02,"command_fail":0.03}}'
      MOCK_BOOTSTRAP_CONCLUDE: '{"delay":[2,6],"outcomes":{"ok":0.8,"rejected":0.1,"invalid_json":0.05,"empty":0.02,"command_fail":0.03}}'
      MOCK_REASON: '{"delay":[2,6],"outcomes":{"intents":0.7,"finalize":0.1,"rejected":0.1,"invalid_json":0.05,"empty":0.02,"command_fail":0.03}}'
      MOCK_EXPLORE_EXECUTE: '{"delay":[5,10],"outcomes":{"fact":0.8,"rejected":0.1,"invalid_json":0.05,"empty":0.02,"command_fail":0.03}}'
      MOCK_EXPLORE_CONCLUDE: '{"delay":[2,6],"outcomes":{"fact":0.8,"rejected":0.1,"invalid_json":0.05,"empty":0.02,"command_fail":0.03}}'
      MOCK_EXPLORE_COVERAGE_OUTCOME: '{"outcomes":{"no_issue":0.5,"finding_created":0.4,"not_applicable":0.1}}'
      MOCK_VERIFY: '{"delay":[2,6],"outcomes":{"confirmed":0.5,"rejected":0.2,"needs_more_evidence":0.2,"accepted_false":0.1},"payload":{"verified_severity":"high","verified_traffic_ids":["tr-001"],"suggested_action":"none","reason":"mock"}}'
      MOCK_REPLAY: '{"delay":[1,3],"outcomes":{"remediated":0.6,"unchanged":0.3,"ambiguous":0.1},"payload":{"matched_original":0}}'
